plugins {
    id 'com.android.application'
}

android {
    namespace 'com.campus.survival'
    compileSdk 34

    defaultConfig {
        applicationId "com.campus.survival"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// No external libraries on purpose: pure Android SDK (Activity, ListView, SQLite).
dependencies {
}
